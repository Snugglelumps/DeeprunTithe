# Pushing a tag like v1.0.1 packages the add-on, makes a GitHub release,
# and uploads to CurseForge. The project ID comes from DeeprunTithe.toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
